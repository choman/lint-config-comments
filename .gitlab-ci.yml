# .gitlab-ci.yml — lint-config-comments
#
# Push to any branch:             lint
# Push to main (not a bump):      bump   -> cz bump, commit + tag pushed back
# Tag vX.Y.Z (from bump):         release (GitLab release with CHANGELOG notes)
#
# Setup (once):
#   1. Settings > Access tokens: project access token, role Maintainer,
#      scope write_repository.
#   2. Settings > CI/CD > Variables: RELEASE_TOKEN = that token
#      (masked, protected).
#   3. Settings > Repository > Protected tags: protect "v*" for Maintainers.

stages:
  - lint
  - release

variables:
  UV_LINK_MODE: copy
  UV_PYTHON: python3 # use the image's Python, not the exact .python-version pin
  COMMITIZEN: commitizen==4.19.3

default:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim

# ─── Lint ─────────────────────────────────────────────────────────────────────

lint:
  stage: lint
  script:
    - uvx ruff check src
    - uvx ruff format --check src
    # smoke test: both hooks run cleanly against this repo's own configs
    - uv run --frozen ruff-config-comments --formatter none -n .ruff.toml > /dev/null
    - uv run --frozen rumdl-config-comments --formatter none -n .config/rumdl.toml > /dev/null
  rules:
    - if: $CI_COMMIT_BRANCH # every branch push (no duplicate MR pipelines)

# ─── Release ──────────────────────────────────────────────────────────────────

# Bump the version from the Conventional Commits since the last tag, update
# CHANGELOG.md, commit and tag. Pushed with RELEASE_TOKEN: pushes made with
# CI_JOB_TOKEN don't start pipelines, so the tag pipeline below would never run.
bump:
  stage: release
  resource_group: release # one release at a time
  variables:
    GIT_DEPTH: 0 # cz needs the full history and tags
    GIT_STRATEGY: clone
  before_script:
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
  script:
    - git config user.name "${GITLAB_USER_NAME}"
    - git config user.email "${GITLAB_USER_EMAIL}"
    - git remote set-url origin "https://oauth2:${RELEASE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - |
      if [ -z "${RELEASE_TOKEN:-}" ]; then
        echo "ERROR: RELEASE_TOKEN is empty. If it's a protected variable, protect '${CI_COMMIT_BRANCH}' (Settings > Repository > Protected branches)." >&2
        exit 1
      fi
      # git ls-remote would pass for a public repo even with a bad token, so ask the API
      python3 - <<'PY'
      import json, os, sys, urllib.request, urllib.error
      req = urllib.request.Request(
          f"{os.environ['CI_API_V4_URL']}/personal_access_tokens/self",
          headers={"PRIVATE-TOKEN": os.environ["RELEASE_TOKEN"]},
      )
      try:
          tok = json.load(urllib.request.urlopen(req, timeout=20))
      except urllib.error.HTTPError as e:
          sys.exit(f"ERROR: GitLab rejected RELEASE_TOKEN (HTTP {e.code}): wrong value, revoked or expired.")
      print(f"RELEASE_TOKEN: {tok['name']!r} scopes={tok['scopes']} expires={tok['expires_at']}")
      if "write_repository" not in tok["scopes"]:
          sys.exit("ERROR: RELEASE_TOKEN lacks the write_repository scope; create a new token with it.")
      PY
    - git checkout -B "$CI_COMMIT_BRANCH" "$CI_COMMIT_SHA"
    - |
      if ! grep -q '^\[tool\.commitizen\]' pyproject.toml; then
        echo "ERROR: no [tool.commitizen] section in pyproject.toml on ${CI_COMMIT_BRANCH}." >&2
        exit 1
      fi
      if ! git describe --tags --abbrev=0 --match 'v[0-9]*' > /dev/null 2>&1; then
        echo "ERROR: no v* tag yet. Tag the current release once by hand (git tag -a v0.1.0 -m v0.1.0 && git push --tags)." >&2
        exit 1
      fi
    - |
      rc=0
      uvx --from "$COMMITIZEN" cz bump --yes || rc=$?
      if [ "$rc" -eq 21 ]; then
        echo "No release-worthy commits (feat/fix/perf/breaking) since the last tag."
        exit 0
      fi
      [ "$rc" -eq 0 ] || exit "$rc"
    - git push --atomic origin "HEAD:${CI_COMMIT_BRANCH}" "refs/tags/$(git describe --tags --abbrev=0)"
  rules:
    # skip the pipeline started by the bump commit itself
    - if: $CI_COMMIT_MESSAGE =~ /^bump:/
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"

# GitLab release for the tag. Notes = the tag's section of CHANGELOG.md,
# which the bump job just wrote.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  script:
    # headings look like "## [v1.2.3](release url) (date)" or "## v1.2.3 (date)"
    - awk -v tag="$CI_COMMIT_TAG" '$1 == "##" { f = ($2 == tag || index($2, "[" tag "]") == 1); next } f' CHANGELOG.md > notes.md
    - cat notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: ./notes.md
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
