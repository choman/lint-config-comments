[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling",
]

[project]
name = "lint-config-comments"
version = "0.3.1"
description = "Annotate rumdl and ruff configs with rule names and descriptions"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "pyyaml>=6.0.3",
    "tomlkit>=0.11.5",
]
optional-dependencies.ruff = [ "ruff" ]
optional-dependencies.rumdl = [ "rumdl" ]
scripts.ruff-config-comments = "lint_config_comments.ruff:main"
scripts.rumdl-config-comments = "lint_config_comments.rumdl:main"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version_files = [
    "src/lint_config_comments/__init__.py:__version__",
    "VERSION.yml:version",
]
bump_message = "bump: version $current_version → $new_version"
major_version_zero = true
tag_format = "v$version"
annotated_tag = true
changelog_incremental = true
update_changelog_on_bump = true
extras = { release_url = "https://gitlab.com/choman/lint-config-comments/-/releases" }
template = ".gitlab/templates/CHANGELOG.md.j2"  # adds release links, drops repeated entries, keeps "Unreleased" on top
change_type_map = { feat = "Added", fix = "Fixed", refactor = "Changed", perf = "Changed" }
