[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling",
]

[project]
name = "lint-config-comments"
version = "0.1.0"
description = "Annotate rumdl and ruff configs with rule names and descriptions"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "bump-my-version>=1.8.1",
    "pyyaml>=6.0.3",
    "tomlkit>=0.11.5",
]
optional-dependencies.ruff = [ "ruff" ]
optional-dependencies.rumdl = [ "rumdl" ]
scripts.ruff-config-comments = "lint_config_comments.ruff:main"
scripts.rumdl-config-comments = "lint_config_comments.rumdl:main"

[tool.commitizen]
change_type_map = { feat = "Added", fix = "Fixed", refactor = "Changed", perf = "Changed" }
